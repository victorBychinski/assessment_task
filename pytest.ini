[pytest]
# Logging configuration
log_file = tests.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format=%Y-%m-%d %H:%M:%S
log_cli = true
log_cli_level = INFO

testpaths = tests
pythonpath = src
markers =
    smoke: Smoke tests
    e2e: Heavy end-to-end tests
    auth: Authentication related tests